name: Update Kistje Vol Smaak

on:
  workflow_dispatch:
  schedule:
    # Twee keer per dag, teruggebracht van vijf nadat de bron de runners
    # tijdelijk met HTTP 403 weigerde -- vermoedelijk een rate-limit.
    #
    # De tijden volgen de waargenomen publicatie (donderdag ~12:20 lokaal).
    # Dat is 10:20 UTC in de zomer en 11:20 UTC in de winter, dus de eerste
    # run staat na beide momenten:
    #   12:17 UTC = 14:17 CEST / 13:17 CET  -> vangt de publicatie binnen ~2u
    #   18:17 UTC = 20:17 CEST / 19:17 CET  -> vangnet als de eerste faalt
    #
    # Eén waarneming is weinig; observed_modified_history in status.json
    # verzamelt er meer, zodat dit later onderbouwd bijgesteld kan worden.
    - cron: "17 12,18 * * *"

# Geen push-trigger: de workflow commit zelf naar dezelfde branch en zou zich
# anders eindeloos opnieuw aanroepen.

permissions:
  contents: write

concurrency:
  group: update-kistje
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      # Doorgegeven aan verify-published, zodat die kan controleren dat Pages
      # de publicatie van deze run serveert en niet nog de vorige.
      publication_hash: ${{ steps.publish.outputs.publication_hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python installeren
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Unit tests draaien
        # Live tests hier uitgesloten: die draaien in verify-published,
        # na de publicatie, tegen de publieke URL.
        run: python -m pytest -q -m "not live"

      - name: Live integratietest tegen de WordPress API
        # Alleen bij handmatige runs. Deze test doet een eigen fetch, en op
        # het schema zou dat het aantal verzoeken aan de bron verdubbelen.
        # De bron blijkt gevoelig voor volume (HTTP 403 vanaf runner-IP's),
        # dus scheduled runs raken de bron precies een keer.
        if: github.event_name == 'workflow_dispatch'
        run: python -m pytest tests/test_live_api.py -v -s

      - name: Live fetch, parse en publiceer
        id: publish
        run: |
          python -m src.build --raw-out raw_response.json
          hash=$(python -c "import json; print(json.load(open('docs/api/status.json'))['publication_hash'])")
          echo "publication_hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Gepubliceerde publication_hash: $hash"

      - name: Ruwe response bewaren voor debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-response
          path: raw_response.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Controleren of er iets gewijzigd is
        id: diff
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short docs/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Geen wijzigingen in docs/; niets te committen."
          fi

      - name: Committen en pushen
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore(kistje): update published box contents [skip ci]"
          git push

  # Verificatie via de publieke GitHub Pages-URL. De E2E-test is pas geslaagd
  # als de data daadwerkelijk opnieuw van het publieke eindpunt is opgehaald.
  verify-published:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python installeren
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Publieke Pages-URL uitlezen en valideren
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          EXPECTED_PUBLICATION_HASH: ${{ needs.update.outputs.publication_hash }}
        run: python -m src.verify_published

      - name: Live E2E van de consumerclient
        run: python -m pytest tests/test_e2e.py -v -s
